name: Deploy to OVH (SFTP)

on:
  push:
    branches:
      - V2

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets are present
        shell: bash
        run: |
          if [ -z "${{ secrets.SFTP_HOST }}" ]; then echo "Missing SFTP_HOST secret"; exit 1; fi
          if [ -z "${{ secrets.SFTP_USER }}" ]; then echo "Missing SFTP_USER secret"; exit 1; fi
          if [ -z "${{ secrets.SFTP_PASSWORD }}" ]; then echo "Missing SFTP_PASSWORD secret"; exit 1; fi
          if [ -z "${{ secrets.SFTP_PORT }}" ]; then echo "Missing SFTP_PORT secret"; exit 1; fi

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload site via SFTP (lftp)
        shell: bash
        run: |
          lftp -e "set sftp:auto-confirm yes; set net:timeout 20; open -u '${{ secrets.SFTP_USER }}','${{ secrets.SFTP_PASSWORD }}' sftp://${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PORT }}; mirror -R --verbose site/ /home/cierifrssr/thomas; bye"
